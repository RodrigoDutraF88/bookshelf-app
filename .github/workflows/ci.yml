name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          AUTH_GOOGLE_ID: "dummy"
          AUTH_GOOGLE_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"
          GEMINI_API_KEY: "dummy"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      # Use ESLint CLI directly — next lint is deprecated in Next.js 16.
      # SKIP_ENV_VALIDATION prevents @t3-oss/env-nextjs from crashing on
      # missing env vars when ESLint loads the Next.js config.
      - run: npx eslint ./src --ext .ts,.tsx 
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          AUTH_GOOGLE_ID: "dummy"
          AUTH_GOOGLE_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"
          GEMINI_API_KEY: "dummy"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          AUTH_GOOGLE_ID: "dummy"
          AUTH_GOOGLE_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"
          GEMINI_API_KEY: "dummy"
          
    docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bookshelf-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start app + db
        run: |
          cat <<EOF > .env.docker
          DATABASE_URL=postgresql://bookshelf:bookshelf@db:5432/bookshelf
          DIRECT_URL=postgresql://bookshelf:bookshelf@db:5432/bookshelf
          AUTH_SECRET=ci-test-secret-not-for-production
          AUTH_DISCORD_ID=ci
          AUTH_DISCORD_SECRET=ci
          AUTH_GOOGLE_ID=ci
          AUTH_GOOGLE_SECRET=ci
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY=ci
          GEMINI_API_KEY=ci
          EOF
          docker compose up -d db
          docker compose run --rm -T \
            -e DATABASE_URL=postgresql://bookshelf:bookshelf@db:5432/bookshelf \
            app sh -c "npx prisma migrate deploy" || true
          docker compose up -d app

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v