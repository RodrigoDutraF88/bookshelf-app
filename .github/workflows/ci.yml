name: CI


on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"        

      - name: Install dependencies
        run: npm ci


      - name: Generate Prisma client
        run: npx prisma generate


      - name: Typecheck
        run: npm run typecheck
        env:
  
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"


  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: typecheck          # only runs if typecheck passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint           

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
      
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"