name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          AUTH_GOOGLE_ID: "dummy"
          AUTH_GOOGLE_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      # Use ESLint CLI directly — next lint is deprecated in Next.js 16.
      # SKIP_ENV_VALIDATION prevents @t3-oss/env-nextjs from crashing on
      # missing env vars when ESLint loads the Next.js config.
      - run: npx eslint ./src --ext .ts,.tsx 
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          AUTH_GOOGLE_ID: "dummy"
          AUTH_GOOGLE_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-dummy-secret-32-characters-ok"
          AUTH_DISCORD_ID: "dummy"
          AUTH_DISCORD_SECRET: "dummy"
          AUTH_GOOGLE_ID: "dummy"
          AUTH_GOOGLE_SECRET: "dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: "dummy"